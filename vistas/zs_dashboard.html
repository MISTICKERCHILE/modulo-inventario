<div class="h-full w-full bg-slate-900 flex flex-col">
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <span class="text-emerald-500 text-2xl">⚡</span>
            <h1 class="text-xl font-black text-white tracking-widest uppercase">Zeus Control</h1>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-slate-400 text-sm font-mono" id="zs-user-display">admin@buddyerp.com</span>
            <button onclick="cancelarZeusLogin()" class="bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors">
                Cerrar Sesión
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 md:p-8">
        <div class="max-w-7xl mx-auto space-y-6">
            
            <div class="flex justify-between items-end">
                <div>
                    <h2 class="text-2xl font-bold text-white mb-1">Empresas Registradas</h2>
                    <p class="text-slate-400 text-sm">Control de módulos y accesos en tiempo real.</p>
                </div>
                <button onclick="cargarTablaEmpresasZeus()" class="text-emerald-500 hover:text-emerald-400 font-bold text-sm flex items-center gap-2">
                    <span>🔄</span> Actualizar Datos
                </button>
            </div>

            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-2xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900/50 text-slate-400 text-xs uppercase tracking-wider font-bold">
                                <th class="p-4 border-b border-slate-700">Empresa</th>
                                <th class="p-4 border-b border-slate-700 text-center">Módulo Ventas</th>
                                <th class="p-4 border-b border-slate-700 text-center">Módulo Inventario</th>
                                <th class="p-4 border-b border-slate-700 text-center">Módulo Personas</th>
                            </tr>
                        </thead>
                        <tbody id="zs-tabla-empresas" class="text-sm divide-y divide-slate-700/50">
                            <tr>
                                <td colspan="4" class="p-8 text-center text-slate-500">
                                    <div class="animate-pulse">Cargando base de datos global...</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>
