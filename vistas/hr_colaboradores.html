<div class="h-full flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative animate-fade-in">
    
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center shrink-0">
        <div>
            <h1 class="text-xl md:text-2xl font-black text-slate-800">👨‍💼 Colaboradores</h1>
            <p class="text-sm text-slate-500 font-medium mt-1">Gestiona las fichas de tu personal activo</p>
        </div>
        <button onclick="abrirModalNuevaFicha()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-lg transition-colors shadow-sm flex items-center gap-2">
            <span>+</span> <span class="hidden sm:inline">Nuevo Colaborador</span>
        </button>
    </header>

    <div class="p-4 bg-slate-50 border-b border-slate-200 shrink-0">
        <div class="relative w-full max-w-md">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">🔍</span>
            <input type="text" id="hr-buscador-fichas" onkeyup="filtrarFichasLaborales()" placeholder="Buscar por nombre..." class="w-full pl-10 pr-3 py-2 border border-slate-300 rounded-md outline-none font-medium focus:ring-2 focus:ring-emerald-500 shadow-sm transition-shadow">
        </div>
    </div>

    <div class="flex-1 overflow-auto bg-slate-50 w-full">
        <table class="min-w-full divide-y divide-slate-200">
            <thead class="bg-slate-200 sticky top-0 z-10 shadow-sm text-xs font-bold text-slate-600 uppercase">
                <tr>
                    <th class="px-6 py-3 text-left">Colaborador</th>
                    <th class="px-6 py-3 text-left">Cargo</th>
                    <th class="px-6 py-3 text-center hidden md:table-cell">Ingreso</th>
                    <th class="px-6 py-3 text-center">Estado</th>
                    <th class="px-6 py-3 text-right">Acciones</th>
                </tr>
            </thead>
            <tbody id="hr-tabla-fichas" class="divide-y divide-slate-100 bg-white text-sm">
                <tr><td colspan="5" class="p-8 text-center text-slate-500 font-medium">Cargando equipo...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="modal-hr-ficha" class="hidden absolute inset-0 z-[100] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-2 md:p-4">
    <div class="bg-white p-4 md:p-6 rounded-xl shadow-2xl w-full max-w-2xl max-h-[95vh] overflow-y-auto border-t-4 border-emerald-500 transform transition-transform scale-95">
        <div class="flex justify-between items-center mb-4 border-b pb-3">
            <h2 class="text-xl md:text-2xl font-black text-slate-800 flex items-center gap-2" id="hr-ficha-titulo">👤 Nueva Ficha Laboral</h2>
            <button type="button" onclick="cerrarModalFicha()" class="text-slate-400 hover:text-slate-800 text-4xl font-bold leading-none">&times;</button>
        </div>

        <form id="form-hr-ficha" class="space-y-5" onsubmit="guardarFichaLaboral(event)">
            <input type="hidden" id="hr-id-ficha">

            <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                <label class="block text-xs font-black text-blue-800 uppercase tracking-wider mb-2">1. Seleccionar Usuario</label>
                <select id="hr-select-usuario" required class="w-full px-3 py-3 border border-blue-200 rounded-md outline-none focus:ring-2 focus:ring-blue-500 font-bold text-slate-700 bg-white shadow-sm cursor-pointer">
                    <option value="">Cargando usuarios disponibles...</option>
                </select>
                <p class="text-[10px] text-blue-600 mt-1 font-medium">Solo aparecen usuarios de esta empresa que aún no tienen ficha laboral.</p>
            </div>

            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                <label class="block text-xs font-black text-slate-700 uppercase tracking-wider mb-2">2. Asignar Sucursales</label>
                <div id="hr-contenedor-sucursales" class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-32 overflow-y-auto">
                    <p class="text-xs text-slate-500">Cargando sucursales...</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Cargo (Opcional)</label>
                    <select id="hr-ficha-cargo" class="w-full px-3 py-2 border border-slate-200 rounded-md outline-none focus:ring-2 focus:ring-emerald-500 font-bold text-slate-700 bg-slate-50 focus:bg-white transition-colors cursor-pointer">
                        <option value="">-- Seleccionar Cargo --</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Encargado de Tienda">Encargado de Tienda</option>
                        <option value="Cajero">Cajero</option>
                        <option value="Vendedor">Vendedor</option>
                        <option value="Bodeguero">Bodeguero</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tipo de Contrato (Opcional)</label>
                    <select id="hr-ficha-contrato" class="w-full px-3 py-2 border border-slate-200 rounded-md outline-none focus:ring-2 focus:ring-emerald-500 font-bold text-slate-700 bg-slate-50 focus:bg-white transition-colors cursor-pointer">
                        <option value="">-- Seleccionar Tipo --</option>
                        <option value="Indefinido">Indefinido</option>
                        <option value="Plazo Fijo">Plazo Fijo</option>
                        <option value="Honorarios">Honorarios (Boleta)</option>
                        <option value="Part-Time">Part-Time</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Sueldo Base (Opcional) $</label>
                    <input type="number" step="0.01" id="hr-ficha-sueldo" class="w-full px-3 py-2 border border-slate-200 rounded-md outline-none focus:ring-2 focus:ring-emerald-500 font-bold text-slate-700 bg-slate-50 focus:bg-white transition-colors" placeholder="Ej: 500000">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Fecha de Ingreso (Opcional)</label>
                    <input type="date" id="hr-ficha-ingreso" class="w-full px-3 py-2 border border-slate-200 rounded-md outline-none focus:ring-2 focus:ring-emerald-500 font-bold text-slate-700 bg-slate-50 focus:bg-white transition-colors text-sm">
                </div>
            </div>

            <div class="flex flex-col-reverse md:flex-row justify-end gap-3 mt-6 border-t pt-4">
                <button type="button" onclick="cerrarModalFicha()" class="w-full md:w-auto px-6 py-3 md:py-2 bg-white border border-slate-300 rounded-md font-bold text-slate-600 hover:bg-slate-50 transition-colors shadow-sm">Cancelar</button>
                <button type="submit" id="btn-guardar-ficha" class="w-full md:w-auto px-8 py-3 md:py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-md font-bold shadow-sm transition-colors disabled:opacity-50">Guardar Ficha</button>
            </div>
        </form>
    </div>
</div>
