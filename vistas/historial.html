<div class="max-w-7xl mx-auto space-y-5 pb-16">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div>
            <h2 class="text-2xl font-black text-slate-800 flex items-center gap-2"><span>🗂️</span> Historial</h2>
            <p class="text-sm text-slate-500 mt-1">Todo lo que ha pasado en Ventas en un solo lugar: busca, filtra y descarga.</p>
        </div>
        <button onclick="hsDescargar()" id="hs-btn-csv" class="px-4 py-2 border rounded-lg font-bold text-sm text-slate-700 hover:bg-slate-50">⬇️ Descargar CSV</button>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 space-y-3">
        <div id="hs-tipos" class="flex flex-wrap gap-2"></div>
        <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
            <div class="col-span-2"><label class="block text-[11px] font-bold text-slate-500 mb-1">Buscar (cliente, N°, detalle)</label><input id="hs-buscar" oninput="hsBuscarDebounce()" maxlength="80" placeholder="Ej: Zoila, 0012…" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
            <div><label class="block text-[11px] font-bold text-slate-500 mb-1">Desde</label><input id="hs-desde" type="date" onchange="hsAplicar()" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
            <div><label class="block text-[11px] font-bold text-slate-500 mb-1">Hasta</label><input id="hs-hasta" type="date" onchange="hsAplicar()" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
            <div><label class="block text-[11px] font-bold text-slate-500 mb-1">Sucursal</label><select id="hs-sucursal" onchange="hsAplicar()" class="w-full px-3 py-2 border rounded-lg bg-white text-sm"></select></div>
            <div><label class="block text-[11px] font-bold text-slate-500 mb-1">Estado</label><input id="hs-estado" list="hs-estados" onchange="hsAplicar()" maxlength="30" placeholder="Todos" class="w-full px-3 py-2 border rounded-lg text-sm">
                <datalist id="hs-estados"><option value="completada"><option value="por_cobrar"><option value="anulada"><option value="borrador"><option value="aceptada"><option value="convertida"><option value="pendiente"><option value="parcial"><option value="pagada"><option value="cuadrado"><option value="con diferencia"></datalist></div>
        </div>
        <p id="hs-nota" class="hidden text-[11px] text-slate-400">Al filtrar por sucursal no aparecen las cotizaciones, porque no pertenecen a una sucursal.</p>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
        <table class="min-w-full text-sm">
            <thead class="bg-slate-50 text-xs font-bold text-slate-500 uppercase"><tr><th class="px-3 py-2 text-left">Fecha</th><th class="px-3 py-2 text-left">Tipo</th><th class="px-3 py-2 text-left">N°</th><th class="px-3 py-2 text-left">Cliente</th><th class="px-3 py-2 text-left">Detalle</th><th class="px-3 py-2 text-left">Sucursal</th><th class="px-3 py-2 text-right">Monto</th><th class="px-3 py-2 text-center">Estado</th></tr></thead>
            <tbody id="hs-tabla" class="divide-y divide-slate-100"></tbody>
        </table>
        <p id="hs-vacio" class="hidden p-8 text-center text-sm text-slate-400">No hay registros con estos filtros.</p>
        <div class="flex items-center justify-between p-3 border-t text-sm">
            <span id="hs-info" class="text-slate-500"></span>
            <div class="flex gap-2"><button id="hs-prev" onclick="hsPagina(-1)" class="px-3 py-1.5 border rounded-lg font-bold disabled:opacity-40">← Anterior</button><button id="hs-next" onclick="hsPagina(1)" class="px-3 py-1.5 border rounded-lg font-bold disabled:opacity-40">Siguiente →</button></div>
        </div>
    </div>
</div>
